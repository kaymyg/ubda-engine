version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # bincode 3.0.0 is a tombstone release (only a compile_error!); the
      # project was discontinued. Stay on 1.x.
      - dependency-name: "bincode"
        versions: [">=3"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
